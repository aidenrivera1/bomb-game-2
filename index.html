<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bomb Game</title>

<style>
body{
  font-family: Arial;
  text-align:center;
  padding:20px;
  background:#f4f4f4;
}

button{
  padding:15px 25px;
  font-size:18px;
  margin:10px;
}

table{
  margin:auto;
  border-collapse:collapse;
}

td{
  padding:8px;
}

input{
  padding:6px;
  font-size:16px;
}

.wordRow{
  background:white;
  margin:5px auto;
  padding:10px;
  width:90%;
  max-width:600px;
  display:flex;
  justify-content:space-between;
  border-radius:6px;
}

.bomb{
  color:red;
  font-weight:bold;
}
</style>
</head>

<body>

<h1>💣 Bomb Game</h1>

<div id="home">
  <button onclick="show('clue')">Clue Giver</button>
  <button onclick="show('defuse')">Defuser</button>
</div>

<!-- CLUE GIVER -->
<div id="cluePage" style="display:none">

<h2>Clue Giver</h2>

<button onclick="generate()">Generate 10 Words</button>
<button onclick="nextClue()">Next Clue</button>
<button onclick="revealBomb()">Reveal Bomb</button>
<button onclick="goHome()">Back</button>

<div id="clueList"></div>
<div id="clueFeed"></div>

</div>

<!-- DEFUSER -->
<div id="defusePage" style="display:none">

<h2>Defusers</h2>

<button onclick="makeDefuse()">Create Sheet</button>
<button onclick="goHome()">Back</button>

<div id="defuseList"></div>

</div>

<script>

let words = [];
let bomb = "";

let listA = [];
let listB = [];
let clueIndex = 0;

// LOAD WORDS
async function load(){
  listA = (await fetch('listA.txt').then(r=>r.text()))
  .split(/\r?\n/).filter(Boolean);

  listB = (await fetch('listB.txt').then(r=>r.text()))
  .split(/\r?\n/).filter(Boolean);
}
load();

function show(page){
  home.style.display="none";
  cluePage.style.display="none";
  defusePage.style.display="none";

  if(page==="clue") cluePage.style.display="block";
  if(page==="defuse") defusePage.style.display="block";
}

function goHome(){
  home.style.display="block";
  cluePage.style.display="none";
  defusePage.style.display="none";
}

function shuffle(arr){
  return arr.sort(()=>Math.random()-0.5);
}

/* ---------------- CLUE GIVER ---------------- */

function generate(){
  words = shuffle([...listA]).slice(0,10);
  bomb = words[Math.floor(Math.random()*words.length)];

  clueIndex = 0;
  clueFeed.innerHTML = "";

  let html = "";

  words.forEach(w=>{
    html += `
      <div class="wordRow" id="${w}">
        <div>${w}</div>
        <input placeholder="clue for ${w}">
      </div>
    `;
  });

  clueList.innerHTML = html;
}

function nextClue(){
  if(clueIndex >= listB.length) return;

  let clue = listB[clueIndex];
  let number = clueIndex + 1;

  clueFeed.innerHTML += `<div>${number}. ${clue}</div>`;
  clueIndex++;
}

function revealBomb(){
  let rows = document.querySelectorAll(".wordRow");

  rows.forEach(r=>{
    if(r.id === bomb){
      r.classList.add("bomb");
    }
  });
}

/* ---------------- DEFUSER ---------------- */

function makeDefuse(){

  let html = "";

  for(let i=0;i<10;i++){
    html += `
      <div class="wordRow">
        <input placeholder="Word ${i+1}">
        <input placeholder="Clue you hear">
      </div>
    `;
  }

  defuseList.innerHTML = html;
}

</script>

</body>
</html>
